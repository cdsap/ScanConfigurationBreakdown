name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish scb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Tests gate the release: a tag should never ship a binary that failed them.
      - name: Build and test
        run: ./gradlew build fatBinary

      - name: It runs
        run: |
          set -euo pipefail
          ./scb --help > /dev/null
          ./scb list --help > /dev/null
          echo "::notice::binary smoke test passed"

      - name: Checksum
        run: sha256sum scb > scb.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # A tag pushed from the CLI has no release yet; one created through the
          # GitHub UI already does. Handle both rather than failing on the second.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" scb scb.sha256 --clobber
          else
            gh release create "$TAG" scb scb.sha256 \
              --title "$TAG" \
              --generate-notes
          fi
