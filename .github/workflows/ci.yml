name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      # Proves the fat binary is wired up and its main class resolves, which a
      # compile alone does not: a wrong fatBinary.mainClass builds fine and then
      # dies at runtime with ClassNotFoundException.
      - name: Build the executable
        run: ./gradlew fatBinary

      - name: It runs
        run: ./scb --help

      - uses: actions/upload-artifact@v4
        with:
          name: scb
          path: scb
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  smoke-test:
    name: Smoke test against a live instance
    needs: build
    runs-on: ubuntu-latest
    env:
      # The instance and the filter the smoke test reads. These name real builds,
      # so when the experiment data ages off the instance this is the one place
      # to repoint -- a filter that matches nothing fails the job by design.
      SERVER: https://ge.solutions-team.gradle.com
      TAG: no_sc
      PROJECT: nowinandroid
      TASK: ':core:model:compileKotlin'
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      # No checkout and no Gradle: the downloaded binary is the whole tool, so
      # this job also proves it runs on a machine that has nothing but a JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: scb

      - run: chmod +x scb

      # The secrets context is not available in a job-level `if`, so the guard
      # lives here. Without the secret the job passes and says it skipped,
      # rather than failing on every fork PR and before the secret is added.
      - name: Is there an access key?
        id: guard
        run: |
          if [ -n "$DEVELOCITY_ACCESS_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DEVELOCITY_ACCESS_KEY secret; skipping the live smoke test."
          fi

      - name: List builds and check the CSV
        if: steps.guard.outputs.available == 'true'
        run: |
          set -euo pipefail
          ./scb list \
            --server "$SERVER" \
            --tag "$TAG" \
            --project "$PROJECT" \
            --task "$TASK" \
            --max-builds 3 > builds.csv

          cat builds.csv

          header=$(head -1 builds.csv)
          expected="buildId,project,totalConfiguration,scriptCompilation,modelConfiguration,configurationResolution,pluginBuilding,taskGraphCalculation"
          [ "$header" = "$expected" ] || { echo "::error::unexpected CSV header: $header"; exit 1; }

          rows=$(($(wc -l < builds.csv) - 1))
          [ "$rows" -gt 0 ] || { echo "::error::no data rows returned"; exit 1; }
          echo "::notice::$rows builds returned configuration data"

          # Every row must carry a positive total configuration time; a shape
          # change in the scan-data payload shows up here as zeros.
          awk -F, 'NR > 1 && $3 + 0 <= 0 { print "::error::non-positive total configuration in: " $0; bad = 1 } END { exit bad }' builds.csv

      - name: A missing access key is reported clearly
        if: steps.guard.outputs.available == 'true'
        run: |
          set -euo pipefail
          if DEVELOCITY_ACCESS_KEY= ./scb list --server "$SERVER" --tag "$TAG" --max-builds 1 2> error.txt; then
            echo "::error::expected a failure when no access key is available"
            exit 1
          fi
          grep -q "access key is required" error.txt || {
            echo "::error::unhelpful error when the access key is missing:"; cat error.txt; exit 1;
          }
